name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: M1 demo (offline, SIMULATED)
        run: npx tsx scripts/demo-m1.ts
      - name: Attack set (offline, SIMULATED)
        run: npx tsx scripts/attack-set/run.ts
