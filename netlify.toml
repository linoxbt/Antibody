# Public demo site: the web view replaying a recorded SIMULATED walkthrough,
# generated at build time by running the real code on the offline backend.
[build]
  command = "npx tsx scripts/build-site.ts"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The console is a single-page app; old standalone pages moved into it.
[[redirects]]
  from = "/console"
  to = "/app/steward"
  status = 301

[[redirects]]
  from = "/graph"
  to = "/app/memory"
  status = 301

[[redirects]]
  from = "/ledger"
  to = "/app/ledger"
  status = 301

[[redirects]]
  from = "/incidents"
  to = "/app/incidents"
  status = 301

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200
