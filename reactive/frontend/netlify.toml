# Antibody Guard site (built from reactive/frontend by reactive/scripts/build-web.ts, deployed from the
# reactive-guard branch). The Guard service on Railway answers /api/*, same origin.
[build]
  publish = "."
  command = "echo static"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.reown.com; font-src 'self' https://fonts.reown.com; img-src 'self' data: blob: https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://api.web3modal.org https://imagedelivery.net; connect-src 'self' https://sepolia.base.org https://ethereum-sepolia-rpc.publicnode.com https://lasna-rpc.rnk.dev wss://relay.walletconnect.com wss://relay.walletconnect.org wss://www.walletlink.org https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://api.web3modal.org https://pulse.walletconnect.org; frame-src https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/install.sh"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/evidence.json"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/api/*"
  to = "https://antibody-guard-production.up.railway.app/api/:splat"
  status = 200
  force = true

# the hosted MCP endpoint (Streamable HTTP)
[[redirects]]
  from = "/mcp"
  to = "https://antibody-guard-production.up.railway.app/mcp"
  status = 200
  force = true

# the console is a single-page app
[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

# the earlier status page
[[redirects]]
  from = "/live"
  to = "/app/loops"
  status = 301
[[redirects]]
  from = "/live.html"
  to = "/app/loops"
  status = 301
