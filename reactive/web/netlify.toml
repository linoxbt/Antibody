# Antibody Guard status site (deployed from the reactive-guard branch; built by reactive/scripts/build-web.sh).
[build]
  publish = "."
  command = "echo static"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"

# The Guard service on Railway (indexer and AI scorer endpoint); same origin, so the dashboard's CSP stays 'self'.
[[redirects]]
  from = "/api/*"
  to = "https://antibody-guard-production.up.railway.app/api/:splat"
  status = 200
  force = true
