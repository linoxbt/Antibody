<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Console · Antibody</title>
  <meta name="description" content="Run Steward and an unprotected agent side by side, and watch Antibody decide." />
  <meta name="theme-color" content="#030407" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/assets/fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/css/brand.css" />
</head>
<body data-page="console">
  <div class="app-bg" aria-hidden="true"></div>
  <main class="wrap">
    <div class="page-head">
      <div><span class="eyebrow">Console <b>02</b></span><h1 class="words">Steward, <span class="tail">watched.</span></h1></div>
      <div id="modebar"></div>
    </div>
    <div class="app-main">
      <section class="stat-row" id="stats" aria-label="System status"></section>
      <section class="card glow">
        <div class="card-title"><div><h3>Split screen</h3></div></div>
        <form id="run-form" style="display:grid;gap:12px;margin-bottom:20px">
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            <input id="instruction" aria-label="Instruction to Steward" value="Pay this month's rent." style="flex:1 1 320px" />
            <label class="small muted" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="execute" style="height:auto" /> execute</label>
            <button class="btn btn-primary" id="run-btn" type="submit">Run</button>
          </div>
          <div class="chips" id="presets"></div>
        </form>
        <div class="split">
          <div class="pane protected"><div class="pane-head"><span class="kicker">Steward + Antibody</span><span class="pill live plain" id="model-pill"></span></div><div id="pane-p"></div></div>
          <div class="pane unprotected"><div class="pane-head"><span class="kicker">Unprotected agent</span><span class="pill bad plain">no policy</span></div><div id="pane-u"></div></div>
        </div>
      </section>
      <section class="grid-2">
        <div class="card"><div class="card-title"><div><h3>Lanes</h3></div></div><div id="lanes"></div></div>
        <div class="card"><div class="card-title"><div><h3>Restoration</h3></div></div>
          <dl class="kv" id="digests"></dl>
          <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn btn-ghost btn-sm" id="rebuild-btn">Rebuild --fresh</button><span id="digest-match"></span></div>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/assets/js/pages/console.js"></script>
</body>
</html>
