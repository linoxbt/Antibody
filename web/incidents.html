<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incidents · Antibody</title>
  <meta name="description" content="Sentinel incidents, quarantine and the forensic view of excluded memories." />
  <meta name="theme-color" content="#030407" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/assets/fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/css/brand.css" />
</head>
<body data-page="incidents">
  <div class="app-bg" aria-hidden="true"></div>
  <main class="wrap">
    <div class="page-head">
      <div><span class="eyebrow">Incidents <b>05</b></span><h1 class="words">Incidents, <span class="tail">contained.</span></h1></div>
      <div id="modebar"></div>
    </div>
    <div class="app-main">
      <section class="grid-2">
        <div class="card"><div class="card-title"><div><h3>Sentinel</h3></div></div><div class="feed" id="incidents"></div></div>
        <div class="card glow"><div class="card-title"><div><h3>Quarantine</h3></div></div>
          <form id="q-form" style="display:grid;gap:10px">
            <select id="q-type" aria-label="Seed type"><option value="source">source (object id)</option><option value="memory">memory (envelope id)</option><option value="turn">turn (turn id)</option></select>
            <input id="q-value" placeholder="0x… or envelope id" aria-label="Seed value" />
            <button class="btn btn-primary" type="submit">Quarantine</button>
          </form>
          <hr class="rule" style="margin:24px 0" />
          <h3 style="font-size:18px">Revoke a lane key</h3>
          <p class="small muted">Needs the owner wallet.</p>
          <pre class="quote">antibody revoke --lane wallet-objects --rotate</pre>
        </div>
      </section>
      <section class="card"><div class="card-title"><div><h3>Excluded · kept as evidence</h3></div></div><div class="feed" id="forensic"></div></section>
    </div>
  </main>
  <script type="module" src="/assets/js/pages/incidents.js"></script>
</body>
</html>
